{{- if .Values.preInstallHooks.mongodb.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "clinic-booking-api.fullname" . }}-pre-install-mongodb-check
  labels:
    {{- include "clinic-booking-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 0
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "clinic-booking-api.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: mongodb-connectivity-check
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -e
              URI="{{ .Values.mongodb.uri }}"
              if [ -z "$URI" ]; then
                echo "Error: .Values.mongodb.uri is not set"
                exit 1
              fi
              echo "Checking connectivity to MongoDB endpoint..."

              # Basic extraction of host and port from URI
              # Handles mongodb://[user:pass@]host1[:port1][,...hostN[:portN]][/[database][?options]]
              # and mongodb+srv://[user:pass@]host[/[database][?options]]

              CLEAN_URI=$(echo $URI | sed -e 's|^[^/]*//||')
              # Remove credentials if present
              if echo "$CLEAN_URI" | grep -q "@"; then
                CLEAN_URI=$(echo "$CLEAN_URI" | cut -d@ -f2-)
              fi
              # Remove path and options
              HOST_PORT_PART=$(echo "$CLEAN_URI" | cut -d/ -f1 | cut -d? -f1)
              # Handle multiple hosts (take the first one)
              FIRST_HOST=$(echo "$HOST_PORT_PART" | cut -d, -f1)

              host=$(echo "$FIRST_HOST" | cut -d: -f1)
              port=$(echo "$FIRST_HOST" | cut -d: -f2)

              if echo "$URI" | grep -q "^mongodb+srv://"; then
                echo "Detected MongoDB+SRV URI. Checking DNS for $host..."
                nslookup "$host" || exit 1
                echo "DNS lookup for $host succeeded."
              else
                if [ -z "$port" ]; then
                  port="27017"
                fi
                echo "Checking $host:$port..."
                nc -z -v -w 5 "$host" "$port" || exit 1
                echo "MongoDB endpoint is reachable."
              fi
      {{- with .Values.preInstallHooks.mongodb.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}