{{- if .Values.hooks.presync.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "clinic-booking-api.fullname" . }}-presync
  labels:
{{- include "clinic-booking-api.labels" . | trim | nindent 4 }}
  annotations:
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
spec:
  backoffLimit: {{ default 0 .Values.hooks.presync.backoffLimit }}
  template:
    metadata:
      labels:
{{- include "clinic-booking-api.selectorLabels" . | trim | nindent 8 }}
    spec:
      serviceAccountName: {{ include "clinic-booking-api.serviceAccountName" . }}
      restartPolicy: Never
      activeDeadlineSeconds: {{ default 300 .Values.hooks.presync.activeDeadlineSeconds }}
      containers:
        - name: presync
          image: "{{ .Values.hooks.presync.image.repository }}:{{ .Values.hooks.presync.image.tag }}"
          imagePullPolicy: {{ .Values.hooks.presync.image.pullPolicy }}
          command:
{{ toYaml .Values.hooks.presync.command | indent 12 }}
          env:
            - name: RELEASE_NAME
              value: "{{ .Release.Name }}"
      {{- if .Values.hooks.presync.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.hooks.presync.image.pullSecrets | nindent 8 }}
      {{- end }}
{{- end }}
