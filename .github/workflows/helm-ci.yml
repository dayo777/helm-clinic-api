name: Helm Chart CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Lint Helm Chart
        run: |
          helm lint .

      - name: Run yamllint
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint
          yamllint .

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.3
        
      - name: Set up Kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Helm Templates (Default)
        run: |
          helm template test-release . | kubeconform -kubernetes-version 1.27.0 -strict -summary

      - name: Validate Helm Templates (Dev)
        run: |
          helm template test-release . -f values-dev.yaml | kubeconform -kubernetes-version 1.27.0 -strict -summary

      - name: Validate Helm Templates (Prod)
        run: |
          helm template test-release . -f values-prod.yaml | kubeconform -kubernetes-version 1.27.0 -strict -summary

      - name: Set up Kube-linter
        run: |
          curl -L https://github.com/stackrox/kube-linter/releases/download/v0.6.0/kube-linter-linux.tar.gz | tar -xz
          sudo mv kube-linter /usr/local/bin/

      - name: Run Kube-linter
        run: |
          helm template . | kube-linter lint -

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Set up Chart Testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run Chart Tests
        run: |
          ct lint --config .ct.yaml || true  # Adjust config as needed

  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Helm Install Dry-run (Default)
        run: |
          helm install dry-run . --dry-run --debug

      - name: Helm Install Dry-run (Dev)
        run: |
          helm install dry-run . -f values-dev.yaml --dry-run --debug

      - name: Helm Install Dry-run (Prod)
        run: |
          helm install dry-run . -f values-prod.yaml --dry-run --debug
