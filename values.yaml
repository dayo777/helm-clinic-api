# values declarations for the default namespace
# You only have to input the MongoDB URI & Database to populate the
# ...secret values, which populates the Settings_dev.toml and is added
# ...to the WorkDir by the Deployment manifest
appName: clinic-booking-api
component: server
partOf: clinic-backend

replicaCount: 1
#namespace: default

image:
  repo: dayo777
  name: clinic-booking-api
  tag: main
  imagePullPolicy: Always # since the latest container is always tagged `main`
  ports:
    name: clinic-ports

service:
  type: LoadBalancer
  port: 8080

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: localhost
      paths:
        - path: /api
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: true
  headers:
    - name: x-api-version
      value: "1"
    - name: Content-Type
      value: application/json

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 512Mi

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

podSecurityContext:
  fsGroup: 2000

gateway:
  name: clinic-api-gw
  hostname: "localhost"

# enter the MongoDB URI & database name below
# also ensure your IP address is trusted by MongoDB to allow access
mongodb:
  uri: ""
  database: ""

# edit the Jaeger endpoint accordingly
# note that the IP addr below is my Minikube addr, so pods can reach localhost
tracing:
  otelEndpoint: "192.168.49.1:4317"

# check connectivity to Jaeger/OTLP endpoint (host:port) before install.
# hook job is deleted after success or failure (see hook-delete-policy).
preInstallHooks:
  jaeger:
    enabled: true
    # imagePullSecrets: []
  mongodb:
    enabled: true
    # imagePullSecrets: []

jaeger:
  enabled: false
  # jaeger specific config goes here